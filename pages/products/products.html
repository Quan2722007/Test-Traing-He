<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sản phẩm</title>
    <link rel="stylesheet" href="products.css" />
    <link rel="stylesheet" href="../../shared/css/utils.css" />
    <link rel="stylesheet" href="../../shared/css/bootstrap.min.css" />
  </head>
  <body>
    <header></header>

    <main class="containerPage">
      <div class="category-title">
        <i class="fa-solid fa-sliders"></i>
        <span>CHỌN DANH MỤC</span>
      </div>

      <div class="px-0">
        <div class="row g-2 align-items-center" id="box-form">
          <div class="col-12">
            <input
              id="searchInput"
              type="text"
              class="form-control filter-control"
              placeholder="Nhập tên cây..."
            />
          </div>

          <div class="col-12">
            <select id="categoryFilter" class="form-select">
              <option value="all" selected>Tất cả danh mục</option>
              <option value="1">Cây trong nhà</option>
              <option value="2">Cây ngoài trời</option>
              <option value="3">Cây ban công</option>
              <option value="4">Cây để bàn</option>
            </select>
          </div>

          <div class="col-12">
            <select id="priceFilter" class="form-select">
              <option value="all" selected>Tất cả mức giá</option>
              <option value="1">Dưới 100.000đ</option>
              <option value="2">100.000đ - 500.000đ</option>
              <option value="3">Trên 500.000đ</option>
            </select>
          </div>

          <div class="col-12">
            <button
              id="resetBtn"
              type="button"
              class="btn reset-btn"
              title="Đặt lại bộ lọc"
            >
              <i class="fa-solid fa-rotate-right"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="px-2 mt-3">
        <div class="row g-3" id="product-list"></div>
      </div>
    </main>

    <footer></footer>

    <script src="../../shared/js/bootstrap.min.js"></script>
    <script type="module" src="./products.js"></script>
    <script
      src="https://kit.fontawesome.com/c4edd7a73c.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
